<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reel Lab — Trend Radar</title><style>body{margin:0;background:#090a0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}.card{background:#14161d;border:1px solid #2b2f39;border-radius:22px;padding:20px;margin:15px 0}.brand{font-size:32px;font-weight:900}.muted{color:#9da3b0}.select,.btn{width:100%;padding:14px;border-radius:13px;margin-top:10px;font-size:16px}.select{background:#0d0f14;color:#fff;border:1px solid #383d49}.btn{border:0;font-weight:800}.trend{background:#0d0f14;border:1px solid #292e38;border-radius:17px;padding:16px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:10px}.pill{display:inline-block;background:#242832;border-radius:999px;padding:6px 9px;font-size:12px;margin:5px 4px 0 0}.green{color:#83f7ad}.yellow{color:#ffd166}.red{color:#ff7d8b}.small{font-size:13px;line-height:1.55}.note{background:#191c23;padding:12px;border-radius:12px;font-size:12px;color:#aeb4bf;margin-top:12px}</style></head><body><div class="wrap"><div class="brand">🔥 TREND RADAR</div><div class="muted">Find what creators are copying before you miss the wave.</div><div class="card"><b>Your niche</b><select id="n" class="select"><option>Corporate / Career</option><option>Fitness</option><option>Finance</option><option>Motivation</option><option>Comedy</option><option>Lifestyle</option><option>Education</option></select><button class="btn" onclick="scan()">Scan Trend Opportunities</button></div><div id="out"></div><div class="note">Live Instagram trend discovery needs a secure backend + authorized/legitimate data sources. This frontend deliberately labels the examples below as signals, not live scraped Instagram counts.</div></div><script>const data={"Corporate / Career":[["Festival-to-niche remix","Rising","High","Use a current cultural moment and connect it to work/career instead of making a generic festival post."],["POV workplace confession","Growing","High","POV + uncomfortable corporate truth + fast payoff. Avoid long setup."],["Failure / flop storytelling","Growing","Medium","Turn a career failure into a short lesson; relatable beats polished advice."]],Fitness:[["Transformation / progress proof","Growing","High","Show the visual result first, then explain the routine or mistake."],["Gym myth reaction","Rising","High","React to one specific myth with proof in the first 2 seconds."],["Fast-cut workout template","Peaking","Medium","Use only if the format still fits your personality; saturation is rising."]],Finance:[["Money mistake POV","Growing","High","Open with a costly mistake and one actionable fix."],["Salary / career numbers","Rising","High","Use a concrete number and explain the hidden trade-off."],["News-to-money explainer","Rising","Medium","Translate a current event into a personal-finance consequence."]],Motivation:[["Hard-truth micro story","Growing","High","One uncomfortable truth + personal example + punchline."],["Failure-to-reframe","Growing","High","Start with the failure, not the lesson."],["Cinematic quote remix","Peaking","Medium","Only use if you add a unique story; generic quotes are saturated."]],Comedy:[["POV character loop","Rising","High","Recurring character + recognizable situation + quick escalation."],["Reaction remix","Growing","High","Use a current meme/template but add a niche-specific punchline."],["Expectation vs reality","Peaking","Medium","Still works when the twist is genuinely specific."]],Lifestyle:[["Day-in-life micro story","Growing","High","Give the viewer a reason to care in the first sentence."],["Aesthetic routine remix","Rising","Medium","Pair visual satisfaction with a surprising practical detail."],["Relatable social observation","Growing","High","One highly specific observation beats generic lifestyle advice."]],Education:[["1 mistake / 1 fix","Growing","High","Problem in 1 second, proof, then one actionable fix."],["Myth vs evidence","Rising","High","Show the claim and evidence visually instead of long explanation."],["News-to-explainer","Rising","Medium","Turn a current event into a useful lesson for the niche."]]};function scan(){const n=document.getElementById('n').value;document.getElementById('out').innerHTML='<div class="card"><b>Opportunities for '+n+'</b><div class="small muted" style="margin-top:5px">Prioritize rising formats; avoid copying a saturated template without a twist.</div>'+data[n].map(t=>'<div class="trend"><div class="row"><b>'+t[0]+'</b><span class="'+(t[1]=='Rising'||t[1]=='Growing'?'green':t[1]=='Peaking'?'yellow':'red')+'">'+t[1]+'</span></div><div class="pill">Niche fit: '+t[2]+'</div><div class="small" style="margin-top:9px">'+t[3]+'</div><div class="small muted" style="margin-top:8px"><b>Adapt:</b> create your own angle; do not copy the original creator word-for-word.</div></div>').join('')+'</div>'}</script></body></html>
